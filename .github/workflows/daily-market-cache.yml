name: Cache daily A-share snapshot

on:
  schedule:
    # 15:25 Asia/Shanghai, after the mainland market closes.
    - cron: '25 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-market-cache
  cancel-in-progress: false

jobs:
  cache-market-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: https://ai-buffett-backend.onrender.com
    steps:
      - name: Wake backend
        run: >-
          curl --silent --show-error --fail-with-body
          --retry 4 --retry-delay 8 --retry-all-errors
          --connect-timeout 20 --max-time 120
          "$BACKEND_URL/health"

      - name: Login as admin
        id: admin_login
        shell: bash
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --header 'Content-Type: application/json' \
            --request POST \
            --data "$(jq -n \
              --arg username "$ADMIN_USERNAME" \
              --arg password "$ADMIN_PASSWORD" \
              '{username:$username,password:$password}')" \
            "$BACKEND_URL/api/v1/auth/login")"

          jq -e '.code == 0 and (.data.token | type == "string" and length > 0)' <<<"$response" >/dev/null
          token="$(jq -r '.data.token' <<<"$response")"
          echo "::add-mask::$token"
          echo "admin_token=$token" >> "$GITHUB_OUTPUT"

      - name: Cache verified board snapshots
        shell: bash
        env:
          ADMIN_TOKEN: ${{ steps.admin_login.outputs.admin_token }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --retry 4 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --request POST "$BACKEND_URL/api/v1/data/sync")"
          jq -e '
            .code == 0 and
            .data.concept.status == "success" and
            .data.industry.status == "success" and
            .data.strategic_evidence.status == "success" and
            .data.strategic_evidence.written >= 1
          ' <<<"$response"

      - name: Verify persisted coverage
        run: >-
          curl --silent --show-error --fail-with-body
          --retry 3 --retry-delay 5 --retry-all-errors
          --connect-timeout 20 --max-time 120
          "$BACKEND_URL/api/v1/data/cache-stats"
