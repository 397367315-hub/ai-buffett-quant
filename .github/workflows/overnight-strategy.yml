name: Run overnight A-share strategy

on:
  schedule:
    # GitHub cron uses UTC. Times below map to Asia/Shanghai (UTC+8).
    - cron: '20 1 * * 1-5'      # 09:20 warmup
    - cron: '31,40,50 1 * * 1-5' # 09:31/09:40/09:50 exit checks
    - cron: '0 2 * * 1-5'       # 10:00 forced exit
    - cron: '20 6 * * 1-5'      # 14:20 warmup
    - cron: '30 6 * * 1-5'      # 14:30 preliminary scan
    - cron: '50 6 * * 1-5'      # 14:50 entry scan
  workflow_dispatch:
    inputs:
      stage:
        description: Strategy stage to run
        required: true
        default: preliminary
        type: choice
        options:
          - warmup
          - preliminary
          - entry
          - exit
          - force_exit

permissions:
  contents: read

concurrency:
  group: overnight-strategy-${{ github.event.schedule || inputs.stage || 'manual' }}
  cancel-in-progress: false

jobs:
  wake-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_URL: https://ai-buffett-backend.onrender.com
    steps:
      - name: Resolve stage
        id: stage
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_STAGE: ${{ inputs.stage }}
        run: |
          if [[ -n "$MANUAL_STAGE" ]]; then
            stage="$MANUAL_STAGE"
          else
            case "$SCHEDULE" in
              '20 1 * * 1-5'|'20 6 * * 1-5') stage='warmup' ;;
              '31,40,50 1 * * 1-5') stage='exit' ;;
              '0 2 * * 1-5') stage='force_exit' ;;
              '30 6 * * 1-5') stage='preliminary' ;;
              '50 6 * * 1-5') stage='entry' ;;
              *) echo "Unsupported schedule: $SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Wake backend
        run: >-
          curl --silent --show-error --fail-with-body
          --retry 5 --retry-delay 10 --retry-all-errors
          --connect-timeout 20 --max-time 180
          "$BACKEND_URL/health"

      - name: Submit strategy stage
        if: steps.stage.outputs.stage != 'warmup'
        id: submit
        shell: bash
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            --header 'Content-Type: application/json' \
            --request POST \
            --data "{\"stage\":\"$STAGE\",\"trigger\":\"github_schedule\"}" \
            "$BACKEND_URL/api/v1/quant/overnight/runs")"
          jq -e '.code == 0 and (.data.run.id | type == "number")' <<<"$response"
          echo "run_id=$(jq -r '.data.run.id' <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Wait for auditable result
        if: steps.stage.outputs.stage != 'warmup'
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id }}
        run: |
          for _ in $(seq 1 60); do
            response="$(curl --silent --show-error --fail-with-body \
              --retry 2 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              "$BACKEND_URL/api/v1/quant/overnight/runs/$RUN_ID")"
            status="$(jq -r '.data.run.status' <<<"$response")"
            if [[ "$status" != 'queued' && "$status" != 'running' ]]; then
              jq '.data.run | {id, stage, status, message, data_date, is_realtime, qualified_count}' <<<"$response"
              [[ "$status" != 'failed' ]]
              exit
            fi
            sleep 10
          done
          echo "Strategy run $RUN_ID did not finish within 10 minutes" >&2
          exit 1
