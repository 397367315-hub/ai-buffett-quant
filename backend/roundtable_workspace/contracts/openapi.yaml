          type: string
          minLength: 1
        effective_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC RFC3339，必须以Z结尾。
        scheduled_end_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
            description: UTC RFC3339，必须以Z结尾。
          - type: 'null'
        related_control_event_id:
          anyOf:
          - type: string
            pattern: ^[a-z][a-z0-9_-]{1,95}$
          - type: 'null'
        reason:
          type: string
          minLength: 1
        expected_previous_event_id:
          anyOf:
          - type: string
            pattern: ^[a-z][a-z0-9_-]{1,95}$
          - type: 'null'
      required:
      - control_type
      - event_type
      - policy_id
      - policy_version
      - effective_at
      - scheduled_end_at
      - related_control_event_id
      - reason
      - expected_previous_event_id
      additionalProperties: false
