openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 交易圆桌本地单用户 API
  version: 1.0.0-draft
  description: 契约规格，不表示端点已经实现。仅绑定127.0.0.1；同源前端；无券商接入。除本地session bootstrap外所有POST须Idempotency-Key；受保护接口默认需有效本地会话，写操作另需CSRF；每个x-phase为最早实现阶段。P3/P4未启用时返回501 FEATURE_DISABLED。
servers:
- url: http://127.0.0.1:8787
paths:
  /api/v1/health/data:
    get:
      operationId: get_api_v1_health_data
      x-phase: P0
      summary: 进程、存储、行情分别报告就绪状态
      description: API可用而行情不可用时可200返回status=unavailable；数据库不可读返回503。不得把旧快照标ready。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthData'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: X-Replay-Id
        in: header
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,95}$
        description: 可选上下文断言；真实权限来自server绑定会话，漏此header仍按会话cutoff；header不同于会话replay_id则403。
  /api/v1/snapshots/latest:
    get:
      operationId: get_api_v1_snapshots_latest
      x-phase: P0
      summary: 获取最新不可变快照
      description: 无快照404；只有过期快照且allow_stale=false返回503 DATA_STALE；true可取旧快照但freshness必须stale。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSnapshot'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: allow_stale
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: ''
      - name: X-Replay-Id
        in: header
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,95}$
        description: 可选上下文断言；真实权限来自server绑定会话，漏此header仍按会话cutoff；header不同于会话replay_id则403。
  /api/v1/llm/config:
    post:
      operationId: post_api_v1_llm_config
      x-phase: P3
      x-contract-extension: ADR-008
      summary: 在页面里修改模型配置（供应商/模型/接口地址/密钥环境变量/预算/JSON 模式）
      description: >-
        写运行目录下的 config/llm.json（原子替换）；可选 api_key 只写入运行目录的私有文件
        config/llm_secrets.json（0600），接口永不回显；写入后立即生效，不需重启。
      security:
        - CsrfToken: []
          LocalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 保存后的状态（不含密钥）
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
  /api/v1/llm/profiles:
    post:
      operationId: post_api_v1_llm_profiles
      x-phase: P3
      x-contract-extension: ADR-009
      summary: 模型存档（保存 / 设为当前 / 复制 / 删除）
      description: >-
        像 CC Switch 那样保存多份模型配置，随时切换当前用哪一份。请求体
        `{action: save|activate|duplicate|delete, profile: {...}, id?, api_key?, clear_api_key?, activate?}`；
        `save` 新建时默认设为当前。写运行目录的 config/llm.json（原子替换）；密钥按存档分开写入
        config/llm_secrets.json（0600），接口永不回显。返回保存后的状态与存档列表。
      security:
        - CsrfToken: []
          LocalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 保存后的状态（不含密钥）
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
  /api/v1/llm/models:
    post:
      operationId: post_api_v1_llm_models
      x-phase: P3
      x-contract-extension: ADR-010
      summary: 拉取某份存档可用的模型清单（供应商 /models）
      description: >-
        请求体 `{id?}`（省略则用当前存档）。服务端用该存档的密钥请求 `GET {base_url}/models`，
        返回 `{ok, count, models: [{name, label, long_context, selected}]}`；失败也返回 200 与
        `{ok: false, code, reason}`，由页面如实显示。`long_context` 来自存档里勾过的「1M」标记。
      security:
        - CsrfToken: []
          LocalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 模型清单或失败原因
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
  /api/v1/llm/seat-model:
    post:
      operationId: post_api_v1_llm_seat_model
      x-phase: P3
      x-contract-extension: ADR-012
      summary: 给某一席单独绑定模型存档（或解除绑定）
      description: >-
        请求体 `{seat_id, profile_id}`；`profile_id` 为 null/空表示跟随全局（当前存档）。
        绑定写在 `<运行目录>/config/llm.json` 的 `seats` 映射里；13 席可以各用不同模型，共用同一本当天 token 总账。
      security:
        - CsrfToken: []
          LocalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat_id]
              additionalProperties: true
      responses:
        '200':
          description: 保存后的状态（含 seat_bindings）
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
  /api/v1/llm/test:
    post:
      operationId: post_api_v1_llm_test
      x-phase: P3
      x-contract-extension: ADR-009
      summary: 试连（用某份存档发一次极短请求，算进当天额度）
      description: >-
        请求体 `{id?}`（省略则用当前存档）。成功返回 `{ok: true, ms, model, tokens}`；
        失败也返回 200 与 `{ok: false, code, reason}`，由页面如实显示原因（不抛 503，不影响其它功能）。
      security:
        - CsrfToken: []
          LocalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 试连结果
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
  /api/v1/llm/status:
    get:
      operationId: get_api_v1_llm_status
      x-phase: P3
      x-contract-extension: ADR-007
      summary: 模型状态（是否配置密钥、预算用量、模型名）
      description: >-
        只读扩展。默认关闭：没有 DEEPSEEK_API_KEY 时 enabled=false，其余模型接口返回 503 LLM_DISABLED。
        不返回、不记录密钥。
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
  /api/v1/seats/{seat_id}/ask:
    post:
      operationId: post_api_v1_seats_seat_id_ask
      x-phase: P3
      x-contract-extension: ADR-007
      security:
        - CsrfToken: []
          LocalSession: []
      summary: 问这一席（用自己的书回答，引用可回查）
      description: >-
        同步调用：带事实表与知识库检索结果请求模型，输出必须通过校验（引用存在、数字来自事实、无买卖指令），
        否则 422 拒收并留审计。训练上下文 409 LLM_DISABLED_IN_REPLAY；未配置密钥 503 LLM_DISABLED。
      parameters:
        - name: seat_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{1,95}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: true
      responses:
        '200':
          description: 回答与引用
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/commander/sessions:
    post:
      operationId: post_api_v1_commander_sessions
      x-phase: P3
      x-contract-extension: ADR-013
      summary: 总指挥：派活给任意席位组合，最后给汇总报告
      description: >-
        请求体 `{question, snapshot_id?, symbols?, max_steps?, prefer_seats?}`（prefer_seats 是「优先派这几席」，不强制）。总指挥可以：`list_seats`（13 席能力）、
        `dispatch`（1–3 席各用自己的模型与书回答，整场最多 2 轮）、`search_all`（全部席位知识库检索）、
        `read_skill`（读某席技能原文）、`market_now`（当前快照的市场/板块摘要）、`data_api`（猫爪只读数据：
        指数日线/估值/涨停事件/日历，白名单）。
        最终报告必须包含结论、各席要点（只能点派过活的席位）、分歧、观察项、缺口与数据来源；数字须来自工具返回，
        不给买卖指令/目标价/胜率，否则 422 拒收。步数用完 422 LLM_STEP_LIMIT；训练/回放 409；未配置密钥 503。
      security:
        - CsrfToken: []
          LocalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: true
      responses:
        '200':
          description: 报告与逐步记录
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/seats/{seat_id}/chat:
    post:
      operationId: post_api_v1_seats_seat_id_chat
      x-phase: P3
      x-contract-extension: ADR-012
      summary: 让这一席自己查资料再回答（工具循环）
      description: >-
        请求体 `{question, snapshot_id?, symbols?, max_steps?}`。模型可以在步数内反复调用只读工具：
        `search_kb`（只检索这一席自己的知识库）、`read_skill`（读技能文件某一节）、`get_facts`（从当前快照取事实）、
        `get_rule_run`（看最近一次跑完的规则结论）、`run_skill_script`（真的重跑这一席的规则脚本，20 秒超时、每轮一次、最多 3 只）。
        每步都留审计；最终结论仍要满足引用可回查、事实存在、数字有出处、无买卖指令，否则 422 拒收。
        步数用完没结论 → 422 LLM_STEP_LIMIT；训练/回放 409；未配置密钥 503。
      security:
        - CsrfToken: []
          LocalSession: []
      parameters:
        - name: seat_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{1,95}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: true
      responses:
        '200':
          description: 结论与逐步的工具调用记录
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/seats/{seat_id}/analyze:
    post:
      operationId: post_api_v1_seats_seat_id_analyze
      x-phase: P3
      x-contract-extension: ADR-011
      summary: 个股分析（规则结论 × 席位解读，模型必须表态）
      description: >-
        请求体 `{seat_run_id, symbol}`：把这一席**已经跑完**的规则结论交给同一席解释，
        输出必须带 `stance`（consistent 一致 / divergent 分歧 / insufficient 数据不够）；说分歧必须写清分歧点，
        说数据不够必须写缺什么，数字只能来自规则结论与事实，否则 422 拒收。运行没跑完 409 SEAT_RUN_NOT_READY；
        训练/回放上下文 409 LLM_DISABLED_IN_REPLAY；未配置密钥 503 LLM_DISABLED。
      security:
        - CsrfToken: []
          LocalSession: []
      parameters:
        - name: seat_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{1,95}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat_run_id, symbol]
              additionalProperties: true
      responses:
        '200':
          description: 规则结论与席位解读
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/reports/postmarket/interpret:
    post:
      operationId: post_api_v1_reports_postmarket_interpret
      x-phase: P3
      x-contract-extension: ADR-007
      security:
        - CsrfToken: []
          LocalSession: []
      summary: 盘后复盘的模型解读（可选联网补缺）
      description: >-
        在规则版复盘之上让模型写解读：数字必须原样出现在报告里，网页引用必须来自本次检索；越界即 422 拒收。enable_search=true 时用 DeepSeek Search 补两融/北向/ETF/外围等未接入项。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/roundtable/sessions:
    post:
      operationId: post_api_v1_roundtable_sessions
      x-phase: P3
      x-contract-extension: ADR-007
      security:
        - CsrfToken: []
          LocalSession: []
      summary: 圆桌联动：1–4 席依次作答，并列结论不投票
      description: >-
        按给定席位顺序各答一轮（主方法→反证→风控/纪律），返回逐席回答与引用；不做汇总评分、不投票。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/snapshots/{snapshot_id}/postmarket:
    get:
      operationId: get_api_v1_snapshots_snapshot_id_postmarket
      x-phase: P1
      x-contract-extension: ADR-006
      summary: 盘后复盘（确定性规则版）
      description: >-
        只读扩展：把一份冻结快照翻译成盘后复盘报告（宽度、情绪与涨停生态、昨日涨停今日表现、成交与流动性、波动、
        指数、主线行业），每个数字带 metric_id 可回查；没有的数据写「未提供」。只做观察与条件陈述，不做预测、不给买卖建议，
        不调用模型。响应是普通对象（含 sections / watchpoints / risks / gaps / markdown），不新增业务模型。
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{1,95}$'
      responses:
        '200':
          description: 复盘报告
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
  /api/v1/snapshots/{snapshot_id}:
    get:
      operationId: get_api_v1_snapshots_snapshot_id
      x-phase: P0
      summary: 按ID读取不可变快照
      description: ''
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketSnapshot'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,95}$
        description: ''
      - name: X-Replay-Id
        in: header
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,95}$
        description: 可选上下文断言；真实权限来自server绑定会话，漏此header仍按会话cutoff；header不同于会话replay_id则403。
  /api/v1/snapshots:
    post:
      operationId: post_api_v1_snapshots
      x-phase: P0
      summary: 手动触发行情采集
      description: 只按用户操作触发，不自动开启后台订阅。完成后resource_id指向新snapshot_id。
      responses:
        '202':
          description: 接受后台任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
          headers:
            Location:
              schema:
                type: string
              description: /api/v1/jobs/{job_id}
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 建议轮询秒数，默认2
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
