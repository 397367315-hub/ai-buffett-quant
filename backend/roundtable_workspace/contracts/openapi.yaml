security:
- LocalSession: []
components:
  securitySchemes:
    LocalSession:
      type: apiKey
      in: cookie
      name: rt_local_session
      description: 本地HttpOnly SameSite=Strict会话cookie；值不返回日志。服务器绑定live/replay上下文，无cookie返回401。
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 需与会话绑定的CSRF token一致；仅同源响应可读。
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            request_id:
              type: string
              pattern: ^[a-z][a-z0-9_-]{1,95}$
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
                required:
                - field
                - reason
                additionalProperties: false
          required:
          - code
          - message
          - request_id
          - retryable
          - details
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    SourceRef:
      type: object
      properties:
        source_id:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,95}$
        authority_type:
          type: string
          enum:
          - exchange
          - issuer
          - vendor
          - user
          - synthetic
        locator:
          anyOf:
          - type: string
          - type: 'null'
        content_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        retrieved_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC RFC3339，必须以Z结尾。
        published_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
            description: UTC RFC3339，必须以Z结尾。
          - type: 'null'
        citation:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - source_id
      - authority_type
      - locator
      - content_sha256
      - retrieved_at
      - published_at
      - citation
      additionalProperties: false
    Evidence:
      type: object
      properties:
        evidence_id:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,95}$
        kind:
          type: string
          enum:
          - api_fact
          - user_statement
          - book_principle
          - rule_derivation
          - research_hypothesis
        snapshot_id:
          anyOf:
          - type: string
            pattern: ^[a-z][a-z0-9_-]{1,95}$
          - type: 'null'
        symbol:
          anyOf:
          - type: string
            pattern: ^[0-9]{6}\.(SH|SZ|BJ)$
          - type: 'null'
        observed_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
            description: UTC RFC3339，必须以Z结尾。
          - type: 'null'
        available_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
            description: UTC RFC3339，必须以Z结尾。
          - type: 'null'
        first_observed_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
            description: UTC RFC3339，必须以Z结尾。
          - type: 'null'
        time_precision:
          type: string
          enum:
          - exact
          - date_only
          - unknown
        availability_basis:
          type: string
          enum:
          - recorded_observation
          - authoritative_publication
          - unknown
        captured_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC RFC3339，必须以Z结尾。
        source_ref:
          $ref: '#/components/schemas/SourceRef'
        field_path:
          anyOf:
          - type: string
          - type: 'null'
        value:
          type:
          - string
          - integer
          - boolean
          - 'null'
