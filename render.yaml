services:
  - type: web
    name: ai-buffett-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-buffett-cache-db
          property: connectionString
      - key: DATA_PROXY_BASE_URL
        value: https://ai-buffett-data-proxy.onrender.com
      - key: DATA_PROXY_TOKEN
        sync: false
      - key: DATA_PROXY_TIMEOUT
        value: "20"
      - key: FTSHARE_MCP_ENABLED
        value: "true"
      - key: FTSHARE_MCP_TIMEOUT
        value: "10"
      - key: LEVEL2_ENABLED
        value: "true"
      - key: NUMCAT_API_KEY
        sync: false
      - key: NUMCAT_API_BASE
        value: https://numcat.net/api
      - key: NUMCAT_TIMEOUT
        value: "20"
      - key: NUMCAT_RETRY_COUNT
        value: "3"
      - key: NUMCAT_MIN_REQUEST_INTERVAL
        value: "0.25"
      - key: LEVEL2_PAGE_SIZE
        value: "5000"
      - key: LEVEL2_MAX_PAGES
        value: "200"
      - key: LEVEL2_MAX_ROWS
        value: "500000"
      - key: LEVEL2_CACHE_SECONDS
        value: "300"
      - key: OPENCLAW_ENABLED
        value: "true"
      - key: OPENCLAW_API_KEY
        sync: false
      - key: OPENCLAW_TOOL_TIMEOUT
        value: "45"
      - key: FEATURE_STRONG_STOCK_DECISION
        value: "true"
      - key: FEATURE_STRONG_STOCK_DECISION_V2
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: PERSONAL_POSITIONS_JSON
        sync: false

  - type: web
    name: ai-buffett-data-proxy
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./tools/china_stock_proxy/Dockerfile
    dockerContext: ./tools/china_stock_proxy
    healthCheckPath: /health
    envVars:
      - key: DATA_PROXY_TOKEN
        sync: false
      - key: DATA_PROXY_TIMEOUT
        value: "8"
      - key: DATA_PROXY_MAX_ATTEMPTS
        value: "2"
      - key: DATA_PROXY_RETRY_DELAY
        value: "0.35"
      - key: FTSHARE_MCP_PROXY_TIMEOUT
        value: "12"

databases:
  - name: ai-buffett-cache-db
    databaseName: ai_buffett
    user: ai_buffett
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
